<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Bring clean water to families who need it most with charity: water.">
    <title>Bring Clean Water | charity: water</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="https://www.charitywater.org/" aria-label="charity: water home">
            <img src="img/cw_logo-2.png" alt="charity: water">
        </a>
    </header>

    <main>
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero-copy">
                <h1 id="hero-title">Tomorrow is in<br>your hands.<br>Be the change.</h1>
                <span class="headline-underline" aria-hidden="true"></span>
                <p class="hero-description">Join a global movement. Bring clean water to families who need it most.</p>
                <a class="donate-button" href="https://www.charitywater.org/donate">
                    <span>Bring Clean Water</span>
                    <span class="button-arrow" aria-hidden="true">→</span>
                </a>
            </div>

            <div class="hero-photo">
                <img src="img/hero-girl.png" alt="A smiling young girl in an orange-red dress holding a glass of clean water, with a turquoise sky and landscape behind her." fetchpriority="high">
            </div>
        </section>
    </main>
</body>
</html>
